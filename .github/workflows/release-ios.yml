name: Build iOS unsigned IPA (TrollStore)
on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION, ios/**, scripts/**, .github/workflows/release-ios.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motonav-ios-personal
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Personalize (bundle id + auto clock sync)
        run: bash scripts/patch-ios-personal.sh
      - name: Install locked iOS dependencies
        working-directory: ios
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install
      - name: Build unsigned iPhone IPA
        run: ./scripts/build-ios-ipa.sh
      - name: Package source and instructions
        shell: bash
        run: |
          VERSION=$(cat RELEASE_VERSION)
          test -f "output/ios/MotoNav-${VERSION}-unsigned.ipa"
          git archive --format=zip --prefix=MotoNav/ HEAD > "output/ios/MotoNav-${VERSION}-source.zip"
          cp docs/INSTALL-IOS.md output/ios/INSTALL-IOS.md
          cp "docs/RELEASE-IOS-${VERSION}.md" output/ios/RELEASE-NOTES.md
          cd output/ios
          shasum -a 256 *.ipa *.zip *.md > SHA256SUMS.txt
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motonav-ios-unsigned
          path: output/ios/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(cat RELEASE_VERSION)
          TAG="ios-v${VERSION}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MotoNav iOS ${VERSION} · TrollStore 免签名" --notes-file "docs/RELEASE-IOS-${VERSION}.md"
          gh release upload "$TAG" output/ios/*.ipa output/ios/*.zip output/ios/*.md output/ios/SHA256SUMS.txt
